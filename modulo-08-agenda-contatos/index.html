<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de contatos</title>

    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agenda de contatos</h1>
        </header>

        <form id="form-contato">
            <input type="text" id="nome-contato" placeholder="Nome do contato" required>
            <input 
    type="number" 
    id="telefone-contato" 
    placeholder="Telefone do contato" 
    required
>
            <button type="submit">
                Cadastrar
            </button>
        </form>

        <table cellspacing="0">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </div>

    <script src="./main.js"></script>
</body>
</html>
